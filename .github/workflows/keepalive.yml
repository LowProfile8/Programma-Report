name: keepalive
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/documenti?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
      - name: App Streamlit
        if: ${{ secrets.APP_URL != '' }}
        run: curl -fsS -o /dev/null "${{ secrets.APP_URL }}" || true
